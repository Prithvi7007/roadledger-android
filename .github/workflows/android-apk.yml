# Template only: a human maintainer must review and install this workflow
# at .github/workflows/roadledger-apk.yml to activate CI builds.
name: RoadLedger Android APK
on:
  push:
    branches: [main, 'feature/roadledger-v03-data-safety', 'feature/roadledger-v03-restore-tests', 'feature/roadledger-v032-stable-signing', 'feature/roadledger-v04-core-experience', 'feature/roadledger-v05-rea-offline', 'feature/roadledger-v06-vehicle-service', 'feature/roadledger-v07-full-experience', 'feature/roadledger-v071-home-navigation', 'feature/roadledger-v072-native-data']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify v0.7.1 home analytics calculations
        run: bash scripts/ci-v71-selftest.sh
      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile unsigned release APK for isolated signing
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload UNSIGNED release (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.7.2-unsigned-release-DO-NOT-INSTALL
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.7.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native backup, rollback and edit tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            bash scripts/ci-v7-screenshots.sh
      - name: Upload visual UX screenshots from the emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.7.2-ui-screenshots
          path: app/build/reports/androidTests/connected/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.7.2-emulator-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30

  emulator-upgrade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise historical and v0.6 to v0.7 upgrades using synthetic records
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/ci-upgrade-test.sh
            adb uninstall fun.cadacrew.roadledger
            bash scripts/ci-v7-upgrade-test.sh
      - name: Upload upgrade test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoadLedger-v0.7.2-upgrade-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30
